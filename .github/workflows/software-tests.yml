name: Software regression tests
on:
  push:
    branches: [main]
    paths: ['software/**', '.github/workflows/software-tests.yml']
  pull_request:
    paths: ['software/**', '.github/workflows/software-tests.yml']
permissions:
  contents: read
concurrency:
  group: software-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential pkg-config libcurl4-openssl-dev libcjson-dev libasound2t64 ffmpeg
      - name: Run companion, task, storage and audio regressions
        run: bash software/app_sdk/tests/run.sh
