name: Repository integrity
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation, assets, versions and release metadata
        run: python3 scripts/check_repository.py
      - name: Check repository environment
        run: python3 scripts/doctor.py --target repo --json
